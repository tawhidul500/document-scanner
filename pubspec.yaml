name: pdf_scanner
description: A local document and code scanner built from supplied Figma screens.
publish_to: none
version: 0.4.0+5
environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.44.0'
dependencies:
  flutter:
    sdk: flutter
  url_launcher: ^6.3.2
  mobile_scanner: 7.4.2
  camera: 0.12.1
  image_picker: 1.2.4
  google_mlkit_text_recognition: 0.16.0
  image: 4.12.0
  pdf: 3.13.1
  lottie: 3.6.1
  path_provider: ^2.1.5
  printing: 5.15.1
  share_plus: 13.3.1
  cross_file: ^0.3.4+2
  flutter_file_dialog: 3.3.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_native_splash: 2.4.8
flutter:
  uses-material-design: true
  assets:
    - assets/splash/splash_animation.json
    - assets/splash/logo.png
    - assets/splash/tagline.png
    - assets/home/
    - assets/camera_menu/
    - assets/fonts/OFL.txt
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
