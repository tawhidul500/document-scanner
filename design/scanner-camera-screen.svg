<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" font-family="'Plus Jakarta Sans', 'Helvetica Neue', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Scan – Camera</title>
<defs>
<linearGradient id="wood" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b08a63"/><stop offset="1" stop-color="#8a6847"/></linearGradient>
<filter id="blur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="8"/></filter>
<clipPath id="vf"><rect x="0" y="56" width="390" height="612"/></clipPath>
</defs>

<rect id="Background" width="390" height="844" fill="#000"/>

<!-- Top bar -->
<g id="TopBar" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
<g id="Close" transform="translate(18 16)"><path d="M5 5l14 14M19 5L5 19"/></g>
<g id="FlashOff" transform="translate(348 16)"><path d="M13 3L6 13h5l-1 8 7-10h-5zM4 4l16 16"/></g>
</g>

<!-- Viewfinder -->
<g id="Viewfinder" clip-path="url(#vf)">
<g transform="translate(0 56)">
<rect width="390" height="612" fill="url(#wood)"/>
<path d="M0 90H390M0 250H390M0 410H390M0 560H390" stroke="#5c3d22" stroke-opacity=".3" stroke-width="2"/>
<polygon points="30,160 340,150 354,482 24,494" fill="#000" fill-opacity=".4" filter="url(#blur)"/>
<polygon points="30,150 336,140 350,472 24,484" fill="#eef1f3"/>
<path d="M38 172L33 466" stroke="#111" stroke-width="10" stroke-dasharray="0 22" stroke-linecap="round"/>
<g fill="none" stroke="#1b2340" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
<path d="M72 200l24-5M84 190l12 5-9 7M112 192q9-9 18 0t18 0t18 0t18 0M214 190q8-8 16 0t16 0t16 0"/>
<path d="M70 232l24-5M82 222l12 5-9 7M110 226q9-9 18 0t18 0t18 0t18 0t18 0"/>
<path d="M66 264l24-5M78 254l12 5-9 7M106 258q9-9 18 0t18 0t18 0M208 256q8-8 16 0t16 0"/>
<path d="M28 304L344 290" stroke-width="2.5"/>
<path d="M64 340q9-9 18 0t18 0t18 0M138 338h20M170 336q9-9 18 0t18 0t18 0"/>
</g>
<g fill="none" stroke="#8a93a8" stroke-opacity=".3" stroke-width="3" stroke-linecap="round"><path d="M70 400q9-9 18 0t18 0t18 0t18 0M110 434q9-9 18 0t18 0t18 0t18 0M200 370q8-8 16 0t16 0M180 466q9-9 18 0t18 0"/></g>
<polygon id="DetectionOutline" points="26,146 340,136 354,478 18,490" fill="#1fd1b4" fill-opacity=".1" stroke="#1fd1b4" stroke-width="2.5" stroke-linejoin="round"/>
<g id="Handles" fill="#fff" stroke="#1fd1b4" stroke-width="3"><circle cx="26" cy="146" r="7"/><circle cx="340" cy="136" r="7"/><circle cx="354" cy="478" r="7"/><circle cx="18" cy="490" r="7"/></g>
</g>
</g>

<!-- Document detected pill -->
<g id="DetectedPill">
<rect x="115.5" y="72" width="159" height="34" rx="17" fill="#000" fill-opacity=".55"/>
<circle cx="133.5" cy="89" r="4" fill="#1fd1b4"/>
<text x="146" y="94" font-size="13" font-weight="600" fill="#fff">Document detected</text>
</g>

<!-- Single / Batch -->
<g id="SingleBatch">
<rect x="107" y="605" width="176" height="47" rx="23.5" fill="#1e1e1e" fill-opacity=".82"/>
<rect x="111" y="609" width="86" height="39" rx="19.5" fill="#fff" fill-opacity=".22"/>
<text x="154" y="633" font-size="14" font-weight="600" fill="#fff" text-anchor="middle">Single</text>
<text x="238" y="633" font-size="14" font-weight="600" fill="#cfd3d8" text-anchor="middle">Batch</text>
</g>

<!-- Mode selector (selected tab centred on shutter) -->
<g id="Modes" font-size="13" font-weight="600" fill="#cfd3d8">
<text x="78" y="694" text-anchor="end">Document</text>
<text x="146" y="694" text-anchor="end">ID Card</text>
<text x="195" y="694" text-anchor="middle" font-weight="700" fill="#1fd1b4">QR Code</text>
<text x="244" y="694">Barcode</text>
</g>

<!-- Bottom controls -->
<g id="Controls">
<g id="ImportImages">
<g transform="translate(71.5 751)" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><rect x="3" y="4" width="20" height="18" rx="3"/><circle cx="9" cy="10" r="2" fill="#fff"/><path d="M4 20l6-6 4 4 3-3 6 6"/></g>
<text x="84.5" y="793" font-size="11" font-weight="600" fill="#fff" text-anchor="middle">Import Images</text>
</g>
<g id="Shutter">
<circle cx="195" cy="774" r="36" fill="none" stroke="#1fd1b4" stroke-width="4"/>
<circle cx="195" cy="774" r="29" fill="#f1f1f1"/>
</g>
<g id="ImportFiles">
<g transform="translate(292.5 751)" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><path d="M6 3h10l5 5v15H6zM16 3v5h5M10 15h7M14 12l3 3-3 3"/></g>
<text x="305.5" y="793" font-size="11" font-weight="600" fill="#fff" text-anchor="middle">Import Files</text>
</g>
</g>
</svg>
