name: Verify and build mobile apps

on:
  workflow_dispatch:
    inputs:
      target:
        description: Platform to build
        type: choice
        required: true
        default: android
        options:
          - android
          - ios
          - both

permissions:
  contents: read

jobs:
  android:
    if: inputs.target == 'android' || inputs.target == 'both'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Check localization and color contrast
        run: python3 -m unittest discover -s tool -p 'test_*.py' -v

      - name: Analyze, test, and build Android APK
        run: python3 tool/build.py apk

      - name: Record APK checksum
        run: sha256sum dist/document-scanner-android-test.apk > dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: android-development-signed-apk
          path: |
            dist/*.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-resolved-lockfile
          path: pubspec.lock

  ios:
    if: inputs.target == 'ios' || inputs.target == 'both'
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - run: python3 tool/build.py ios

      - uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-app-not-installable
          path: dist/*.zip
          if-no-files-found: error
